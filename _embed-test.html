<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>embed test harness</title>
<style>body{margin:0;font:14px monospace}.site-content{max-width:1200px;margin:0 auto}</style>
</head><body class="post-template-single-feature">
<header id="masthead" style="height:60px;background:#eee">masthead</header>
<div class="site-content"><article><header class="entry-header">
<h1 class="entry-title">How Cleveland seniors are staying fed</h1>
<div class="entry-subhead"><div class="entry-meta">
<span class="author-avatar"><img src="https://signalcleveland.org/wp-content/uploads/2025/04/cropped-IMG_4864-scaled-1-120x120.jpg" width="120" height="120" alt="avatar"></span>
<span class="byline"><span>by</span> <span class="author vcard"><a class="url fn n" href="https://example.org/author/tester/">Test Author</a></span></span>
<span class="posted-on"><time class="entry-date published" datetime="2026-10-02T09:00:00-04:00">October 2, 2026</time></span>
</div></div></header>
<div class="entry-content">
<style>
  #masthead{ position:static!important; }

  /* Newspack Theme has no native per-post "hide title" toggle for classic
     posts, so this visually hides the category tag / headline / byline /
     share-icon block above the scrolly. Uses the standard "visually hidden"
     technique (position:absolute + clipped to 1px) rather than display:none,
     so the title stays in the page and in the accessibility tree for screen
     readers — it's just not shown, since the story's own headline takes over
     that role visually. It also has to stay in the DOM for another reason
     here: the JS below reads the real author and published date out of it and
     relays them into the story's byline. Scoped to just this post, since it
     only takes effect wherever this Custom HTML block is placed. */
  .entry-header{
    position:absolute!important;
    width:1px!important; height:1px!important;
    padding:0!important; margin:-1px!important;
    overflow:hidden!important; clip:rect(0,0,0,0)!important;
    white-space:nowrap!important; border:0!important;
  }

  /* the AddToAny share-buttons plugin renders its own row separately from
     .entry-header, right above the rest of .entry-content — hide it too so
     nothing but the scrolly sits below the site nav. Unlike the title, these
     are interactive controls duplicating functionality (share/print links)
     rather than page-identifying content, so display:none (fully removed
     from the tab order) is the right call here, not visually-hidden. */
  .addtoany_share_save_container{ display:none!important; }

  /* THE STORY GOES FIRST, NOTHING GETS HIDDEN.

     Newspack Campaigns injects its inline prompts INTO the post body, at a
     position measured through the content -- so with the Custom HTML block
     as the only thing in the post, a prompt can perfectly well land ahead
     of it. That's what put the "Cleveland, Every Day" donate box and the
     newsletter sign-up between the site nav and the story. Anything else
     the editor leaves ahead of the block (a stray empty paragraph is the
     usual one) does the same thing, and shows up as a thin white band above
     the green.

     The first instinct is to hide them, but that's wrong twice over: it
     throws away the newsroom's fundraising asks, and it only covers the
     cases we happened to think of. Laying .entry-content out as a flex
     column instead, and giving the embed order:-1, puts the story first
     whatever WordPress decides to put in there -- an Epic Footer prompt, a
     newsletter box, an empty paragraph -- and every one of them keeps its
     place in the page, just below the story where it belongs. Nothing here
     needs updating when a campaign changes. */
  .entry-content{ display:flex!important; flex-direction:column!important; }
  #st-embed-wrap{ order:-1!important; }

  /* The two that flex order can't reach, because they aren't in the post
     body at all:

       .global_below_header  the leaderboard ad slot directly under the nav,
                             a sibling of .site-content
       #secondary            the related-articles/ads sidebar column, which
                             sits in the same stacking layer as the story
                             and comes later in the markup -- so against a
                             full-viewport-width pinned photo it painted
                             straight over the top of it

     Scoped to this post, like the other overrides here, since they only
     take effect wherever this Custom HTML block is placed. Hiding the ad
     slot gives up this post's leaderboard inventory; Newspack also offers a
     proper per-post "Hide Advertisements" setting in the post sidebar, so
     prefer that and drop this line if you'd rather keep it out of CSS. The
     .newspack-lightbox overlay prompts are deliberately left alone: they're
     modals that arrive over the top later, not things sitting in the way.

     Better still for the sidebar, set this post's Template to "Single Wide"
     (Post settings -> Template), which is what the John Williams piece
     uses. That drops the sidebar at the theme level -- the body gets
     `no-sidebar` -- instead of leaving an empty column hidden behind the
     story. This rule then costs nothing and covers the case where the
     template gets changed back. */
  .newspack_global_ad.global_below_header{ display:none!important; }
  #secondary.widget-area{ display:none!important; }
  /* With the sidebar gone the article column can have the width back. The
     embed doesn't need it -- it measures its own offset from the true
     viewport edge and cancels it (see fixBreakoutOffset) -- but everything
     that now sits BELOW the story would otherwise stay in a narrow column
     with a blank gap beside it. */
  .has-sidebar .main-content{ width:100%!important; max-width:none!important; float:none!important; }

  .post-template-single-wide .site-content,
  .post-template-single-feature .site-content { overflow: visible!important; }

  #st-embed-wrap{
    position:relative!important;
    width:100vw!important;
    max-width:none!important;
    height:var(--st-scroll-length, 1600vh)!important;
    margin-top:0!important;
    margin-bottom:0!important;
    /* Lifts the pinned story over anything else in the article's own
       stacking layer, so a widget or ad slot the rules above don't know
       about can't paint over it the way the sidebar did. Deliberately just
       1: enough to win against ordinary page furniture, not enough to cover
       a fixed-position overlay like Newspack's lightbox prompts. */
    z-index:1;
  }
  /* Gutenberg/Newspack add block-spacing margin above top-level content
     blocks (including alignfull ones — the width exemption doesn't cover
     vertical spacing), which is what leaves a gap above the embed even with
     the header and share row hidden. */
  .entry-content{ margin-top:0!important; padding-top:0!important; }
  .site-content{ margin-top:0!important; }
  #st-story-hook{ position:sticky!important; top:0!important; height:100vh!important; overflow:hidden; }
  #st-story-hook iframe{ width:100%!important; height:100%!important; border:0!important; display:block; }

  /* The child has a matching override that drops the whole pinned rail under
     reduced motion and falls back to a plain static, top-to-bottom article:
     every photo break leaves the rail and sits in normal flow between its
     two cards. That means it's no longer one pinned screen's worth of
     content — it's a normal, much taller flowing page. Keeping THIS page's
     pin and clip active on top of that would lock the reader's view to a
     fixed 100vh window and cut off nearly all of the now-taller content with
     no way to scroll to the rest. So drop the pin and clip here too and let
     the iframe sit inline at its own natural height instead.

     Getting that height onto the iframe needs a direct JS assist rather than
     trusting pym's own built-in auto-resize: pym.Parent sets the iframe's
     real height with a plain iframe.setAttribute('height', ...) whenever the
     child reports one, but this page's own always-on
     `#st-story-hook iframe{ height:100%!important; }` rule (needed for the
     normal pinned case) outranks that attribute in the cascade whatever its
     value — confirmed by testing on the Williams piece: the iframe never grew
     past this rule's initial size no matter how far the reader scrolled. The
     JS below adds its own 'height' listener that forces an inline !important
     style instead (which DOES outrank a stylesheet !important rule, unlike a
     plain attribute), so min-height here is only the placeholder for the
     instant before that first message lands, not the mechanism doing the
     real sizing. */
  @media (prefers-reduced-motion: reduce){
    #st-embed-wrap{ height:auto!important; }
    #st-story-hook{ position:static!important; height:auto!important; overflow:visible!important; }
    #st-story-hook iframe{ height:auto!important; min-height:100vh; }
  }
</style>

<div id="st-embed-wrap" class="alignfull">
  <div id="st-story-hook"></div>
</div>

<script src="https://pym.nprapps.org/pym.v1.min.js"></script>
<script>
(function(){
  // Signal Cleveland's own performance layer rewrites external <script src>
  // tags to add `defer` automatically (confirmed live: view-source shows
  // `defer` on the pym.js tag above even though this file never adds it) --
  // that pushes pym.js's execution to just before DOMContentLoaded instead of
  // running it synchronously in place. THIS script, having no `src`, can't be
  // deferred the same way (the defer attribute has no effect on inline
  // scripts per spec, so it still runs immediately at parse time regardless),
  // so it was hitting `new pym.Parent(...)` before pym.js had actually run --
  // "pym is not defined", and since that throws, EVERYTHING after it in this
  // script (every event listener, the whole embed) never ran either, leaving
  // just an empty fallback-height box. Waiting for DOMContentLoaded --
  // guaranteed to fire only after any deferred scripts have already executed,
  // in order -- fixes this regardless of whether the site defers pym.js, and
  // keeps working even if that optimization changes again later.
  function init(){
    var CHILD_URL = './senior-tips.html' + location.search;

    var wrap = document.getElementById('st-embed-wrap');
    var pymParent = new pym.Parent('st-story-hook', CHILD_URL, {});

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Under reduced motion the child (see its own matching CSS and the long
    // comment above) drops the pinned rail entirely and is just a plain
    // static, much-taller article -- so instead of stretching this page's
    // outer scroll TRACK to fake a pin, the iframe itself needs to grow to
    // that real height. pym.Parent already listens for the child's built-in
    // 'height' message and sets it via iframe.setAttribute(...), but that's a
    // plain HTML attribute, which this page's own always-on
    // `#st-story-hook iframe{ height:100%!important; }` rule outranks in the
    // cascade whatever its value. Forcing an inline !important style does
    // outrank that stylesheet rule, so add our own listener alongside pym's
    // default one (onMessage supports several handlers per type) to do it.
    if (reduceMotion){
      pymParent.onMessage('height', function(pxStr){
        var iframeEl = document.querySelector('#st-story-hook iframe');
        if (iframeEl) iframeEl.style.setProperty('height', pxStr + 'px', 'important');
      });
    }

    // The child reports its own real measured height (in px) here every time
    // it changes -- on load, on resize, after web fonts settle, and whenever
    // a photo break changes how it lays out -- so this track is always
    // exactly as long as the story actually is. The child scrolls itself to
    // the progress figure this track produces, so the two lengths matching is
    // what makes the scroll 1:1 rather than fast and twitchy.
    pymParent.onMessage('trackHeight', function(pxStr){
      wrap.style.setProperty('--st-scroll-length', pxStr + 'px');
      onScroll();
      handshake();
    });
    // Reduced motion never sends trackHeight (nothing is pinned, so there's
    // no track) -- pym's own height message is the one that arrives, so hook
    // the handshake onto that too. Both are guarded, so whichever comes
    // first wins and the other is a no-op.
    pymParent.onMessage('height', handshake);

    // Two things the child can't work out for itself, sent together once the
    // child is known to be listening. trackHeight (or height) only ever
    // arrives after the child has loaded and registered its own handlers,
    // which sidesteps any race where a message sent too early would just be
    // silently dropped.
    var handshakeDone = false;
    function handshake(){
      if (handshakeDone) return;
      if (!sendPostMeta()) return;
      sendViewport();
      handshakeDone = true;
    }

    // Reads the REAL author / avatar / published date straight off THIS
    // post's own .entry-header -- the same one the CSS above hides visually,
    // though its markup is still very much in the DOM, unhidden as far as JS
    // is concerned -- and relays it into the child, so the byline under the
    // headline always matches whatever WordPress says (right author on a
    // co-written piece, right date whenever this actually goes out) with no
    // separate date to remember to update.
    function sendPostMeta(){
      var meta = document.querySelector('.entry-header .entry-meta');
      if (!meta) return false;
      var avatarImg = meta.querySelector('.author-avatar img, img.avatar');
      var authorA   = meta.querySelector('.byline .author a');
      var dateEl    = meta.querySelector('.posted-on .entry-date.published');
      if (!avatarImg || !authorA || !dateEl) return false;
      pymParent.sendMessage('postMeta', JSON.stringify({
        avatarSrc:    avatarImg.currentSrc || avatarImg.src,
        avatarSrcset: avatarImg.getAttribute('srcset') || '',
        authorName:   authorA.textContent.trim(),
        authorHref:   authorA.href,
        dateText:     dateEl.textContent.trim(),
        dateAttr:     dateEl.getAttribute('datetime') || ''
      }));
      return true;
    }

    // The reader's real screen height. Inside the iframe, a vh is a share of
    // the FRAME, which under reduced motion is as tall as the whole story --
    // so the child can't size anything against the screen without being told
    // how big it is. Only matters in that reduced-motion layout; harmless to
    // send either way.
    function sendViewport(){
      pymParent.sendMessage('viewport', String(window.innerHeight));
    }

    // The child's "Jump to" links can't scroll the child -- pinned, its
    // scroll position belongs to this track -- so they send the point in the
    // story they want as a fraction of it, and this scrolls the track to the
    // matching place. (Flowed, under reduced motion, the child uses pym's own
    // built-in scroll-to-child-element instead, which pym.Parent already
    // handles.) The child also sends this when the browser has scrolled the
    // frame on its own, to bring a keyboard-focused link into view: without
    // it, the next progress message would snap the reader straight back.
    pymParent.onMessage('jumpTo', function(pStr){
      var p = parseFloat(pStr);
      if (!isFinite(p)) return;
      var rect = wrap.getBoundingClientRect();
      var trackTop = rect.top + window.pageYOffset;
      var travel = Math.max(0, rect.height - window.innerHeight);
      window.scrollTo({
        top: trackTop + clamp(p, 0, 1) * travel,
        behavior: reduceMotion ? 'auto' : 'smooth'
      });
    });

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  // Computes the correction WITHOUT first resetting marginLeft to 0 and
  // remeasuring -- that reset-then-remeasure round trip (the previous version
  // of this function) forces a layout flash where the wrap briefly renders at
  // its uncorrected position every single time this runs. That's normally
  // invisible since it's only bound to resize, but iOS Safari fires resize
  // repeatedly WHILE SCROLLING as its address bar collapses and expands,
  // which turned into a visible side-to-side jolt. Undoing the CURRENT
  // margin's own contribution to the measurement instead gets the same
  // corrected value in one step, with nothing to flash.
  function fixBreakoutOffset(){
    var currentMargin = parseFloat(wrap.style.marginLeft) || 0;
    var rect = wrap.getBoundingClientRect();
    var naturalLeft = rect.left - currentMargin;
    var newMargin = -naturalLeft;
    if (newMargin !== currentMargin) wrap.style.marginLeft = newMargin + 'px';
  }

  var ticking = false;
  function onScroll(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      var rect = wrap.getBoundingClientRect();
      var progress = clamp(-rect.top / (rect.height - window.innerHeight), 0, 1);
      pymParent.sendMessage('progress', String(progress));
      ticking = false;
    });
  }

  // Throttled the same way onScroll already is -- iOS Safari can fire a burst
  // of resize events in quick succession (see fixBreakoutOffset's comment
  // above), and running the getBoundingClientRect() reads and writes in there
  // synchronously on every single one is its own source of layout thrashing
  // on top of whatever the browser is already doing.
  var resizeTicking = false;
  function onResize(){
    if (resizeTicking) return;
    resizeTicking = true;
    requestAnimationFrame(function(){
      fixBreakoutOffset();
      resizeTicking = false;
    });
    onScroll();
    // The child sizes its reduced-motion layout against the screen height
    // this reports, so a resized window has to reach it.
    if (handshakeDone) sendViewport();
  }

  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onResize);
  fixBreakoutOffset();
  onScroll();

  // Safety net for wide/no-sidebar desktop layouts: fixBreakoutOffset() above
  // only re-runs on an actual window resize, but DOMContentLoaded (when
  // init() -- and this first fixBreakoutOffset() call -- runs) fires once HTML
  // parsing finishes, which can be well before slower-loading things ABOVE
  // the embed (ad slots, web fonts, images) have settled into their final
  // size. If the page reflows after that first measurement, nothing
  // re-corrects it until the reader happens to resize the window -- on a
  // 100vw-wide box, even a modest error in the resulting margin shoves the
  // whole thing sideways, showing as a blank gap on one side and the embed
  // pushed off-screen on the other. `load` only fires once every resource has
  // actually finished, so re-checking there catches a reflow the first
  // measurement missed, on connections and pages slow enough for one to
  // happen (more third-party ad and tracker weight, slower networks).
  window.addEventListener('load', fixBreakoutOffset);
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    // DOMContentLoaded already fired by the time this ran -- init() would
    // otherwise never get called at all.
    init();
  }
})();
</script>

<p style="padding:40px">Rest of the post, after the story.</p>
</div></article></div>
<pre id="log" style="position:fixed;z-index:9;left:0;bottom:0;margin:0;background:#fff;font:11px monospace"></pre>
<script>
/* test driver: ?y=<fraction of track> scrolls there; logs child state */
window.addEventListener("load",function(){var q=new URLSearchParams(location.search);
 function go(){var w=document.getElementById("st-embed-wrap"),r=w.getBoundingClientRect();
  if(q.get("y")) window.scrollTo(0,r.top+window.pageYOffset+parseFloat(q.get("y"))*(r.height-innerHeight));
  if(q.get("click")) setTimeout(function(){var f=document.querySelector("#st-story-hook iframe");var el=f.contentDocument.querySelector(q.get("click"));el.click();},1500);
  setInterval(function(){var f=document.querySelector("#st-story-hook iframe"),d=f&&f.contentDocument;if(!d)return;var act=[].map.call(d.querySelectorAll(".tips"),function(s){return s.id+":"+(s.classList.contains("is-scrolly")?"pin":"list")+":"+s.querySelector(".tips__count").textContent}).join(" ");
   document.getElementById("log").textContent="track="+w.getBoundingClientRect().height+" parentY="+Math.round(pageYOffset)+" childH="+d.documentElement.scrollHeight+" childY="+Math.round(d.documentElement.scrollTop)+" iframe="+f.clientWidth+"x"+f.clientHeight+" cls="+d.documentElement.className+" byline="+d.querySelector(".entry-meta").textContent.replace(/\s+/g," ").trim()+"\n"+act;},300);}
 setTimeout(go,1500);});
</script></body></html>
